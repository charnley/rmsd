
name: Test Python package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Testing
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - run: sudo apt-get install libopenblas-dev gcc
      - uses: actions/checkout@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: make env python-version=${{ matrix.python-version }}
      - run: source ./env/bin/activate && which calculate_rmsd
      - run: make test
      - run: source ./env/bin/activate && make format
      - run: make build
      - run: make test-dist
      - run: for x in dist/*; do pip uninstall -y rmsd && pip install $x; done
      # - run: pip uninstall -y rmsd && pip install $(find dist -name "*.whl" | tail -n 1)[qml]
      # - run: which calculate_rmsd
