[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rmsd"
dynamic = ["version"]
authors = []
requires-python = ">=3.10"
license-files = ["LICENSE"]
readme="README.rst"
description="Calculate Root-mean-square deviation (RMSD) of two molecules, using rotation, in xyz or pdb format "
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["pdb", "atoms", "kabsch", "reordering", "rotation", "xyz", "rmsd"]

dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
qml = ["qmllib"]
dev = [
    "pytest-benchmark",
    "build",
    "jupyterlab",
    "jupytext",
    "matplotlib",
    "monkeytype",
    "packaging",
    "pip",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
]

[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "env",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort (import sorting)
    "UP", # pyupgrade (modern Python syntax)
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
]
# E501: line length handled by ruff-format
# E203: false positives with formatter (parity with old flake8 config)
ignore = ["E501", "E203"]

[tool.ruff.lint.isort]
known-first-party = ["rmsd"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"*/__init__.py" = ["F401"]
"*.ipynb" = ["F841"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.rules]
# Ignore unresolved imports since pre-commit env doesn't have all packages
unresolved-import = "ignore"

[project.urls]
Homepage = "https://github.com/charnley/rmsd"

[tool.setuptools.packages.find]
include = ["rmsd"]

[project.scripts]
calculate_rmsd = "rmsd.calculate_rmsd:main"

[tool.setuptools.package-data]
rmsd = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "rmsd.version.__version__"}
